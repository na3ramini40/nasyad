name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.6"
  JAVA_VERSION: "17"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check version consistency
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            dart run tool/check_version.dart --tag "${{ github.ref_name }}"
          else
            dart run tool/check_version.dart
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated Drift code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build_apk:
    name: Build APK
    needs: verify
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.app_version.outputs.full }}
      app_version_name: ${{ steps.app_version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app_version
        run: |
          FULL="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?)/\1/p' pubspec.yaml | head -n1)"
          NAME="${FULL%%+*}"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using app version $FULL"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasyad-apk-v${{ steps.app_version.outputs.name }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build_apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nasyad-apk-v${{ needs.build_apk.outputs.app_version_name }}-${{ github.sha }}
          path: dist

      - name: Rename APK for release
        run: mv dist/app-release.apk "dist/nasyad-v${{ needs.build_apk.outputs.app_version_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nasyad ${{ needs.build_apk.outputs.app_version_name }}
          files: dist/nasyad-*.apk
          generate_release_notes: true
