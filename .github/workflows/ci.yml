name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.6"
  JAVA_VERSION: "17"

defaults:
  run:
    working-directory: client

# PRs: skip full client/server verify when only docs/.cursor/etc. changed.
# Non-PR (push/tag/dispatch): always run full verify so master/tag builds stay gated.
# Stub jobs keep the same check names so branch protection still sees "Verify".
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Tag/push skip checkout; must not inherit repo-wide client/ cwd.
    defaults:
      run:
        working-directory: .
    outputs:
      client: ${{ steps.result.outputs.client }}
      server: ${{ steps.result.outputs.server }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5

      - name: Filter paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - 'tool/**'
              - 'docker-compose.yml'
              - 'env.example/**'
              - '.github/workflows/**'
            server:
              - 'server/**'
              - 'tool/**'
              - 'docker-compose.yml'
              - 'env.example/**'
              - '.github/workflows/**'

      - name: Set outputs
        id: result
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "client=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "client=${{ steps.filter.outputs.client }}" >> "$GITHUB_OUTPUT"
            echo "server=${{ steps.filter.outputs.server }}" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check no release signing secrets in git
        run: ./tool/check_no_release_secrets.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Check version consistency
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            dart run tool/check_version.dart --tag "${{ github.ref_name }}"
          else
            dart run tool/check_version.dart
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated Drift code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: >
          flutter test
          --dart-define=GITHUB_OWNER=na3ramini40
          --dart-define=GITHUB_REPO=nasyad

  sync_integration:
    name: Sync integration (two-device)
    needs: changes
    if: >
      needs.changes.outputs.client == 'true' ||
      needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create server venv and install
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/pip install -q -r server/requirements.txt

      - name: Client pub get
        working-directory: client
        run: flutter pub get

      - name: Two-device sync integration
        run: ./tool/sync_integration_test.sh

  sync_integration_docs_only:
    name: Sync integration (two-device)
    needs: changes
    if: >
      needs.changes.outputs.client != 'true' &&
      needs.changes.outputs.server != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Skip sync integration
        run: echo "No client/server paths changed; sync integration skipped."

  verify_docs_only:
    name: Verify
    needs: changes
    if: needs.changes.outputs.client != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Skip full client Verify
        run: echo "No client/tool/CI paths changed on this PR; full Verify skipped."

  verify_server:
    name: Verify server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

  verify_server_docs_only:
    name: Verify server
    needs: changes
    if: needs.changes.outputs.server != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Skip full server Verify
        run: echo "No server/tool/CI paths changed on this PR; full Verify server skipped."

  build_apk:
    name: Build APK
    needs: [changes, verify]
    if: >
      always() &&
      needs.changes.outputs.client == 'true' &&
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'push' &&
         (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.app_version.outputs.full }}
      app_version_name: ${{ steps.app_version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app_version
        run: |
          FULL="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?)/\1/p' pubspec.yaml | head -n1)"
          NAME="${FULL%%+*}"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using app version $FULL"

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Official package id for CI/release builds (local forks use .env/)
          echo 'applicationId=amini.apps.nasyad' > android/nasyad.local.properties
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "::error::Release tags require Android signing secrets. See docs/domain/release.md"
              exit 1
            fi
            echo "No release keystore secrets — building with debug signing (not for sideload upgrades)."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/nasyad-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=keystore/nasyad-release.jks
          EOF

      - name: Build release APKs (per ABI)
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=GITHUB_OWNER=na3ramini40
          --dart-define=GITHUB_REPO=nasyad

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nasyad-apk-v${{ steps.app_version.outputs.name }}-${{ github.sha }}
          # upload-artifact paths are repo-root relative (ignores defaults.run.working-directory)
          path: |
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

  build_linux:
    name: Build Linux
    needs: [changes, verify]
    if: >
      always() &&
      needs.changes.outputs.client == 'true' &&
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'push' &&
         (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    outputs:
      app_version_name: ${{ steps.app_version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app_version
        run: |
          FULL="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?)/\1/p' pubspec.yaml | head -n1)"
          NAME="${FULL%%+*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          VERSION="${{ steps.app_version.outputs.name }}"
          cd build/linux/x64/release/bundle
          tar czf "${GITHUB_WORKSPACE}/nasyad-v${VERSION}-linux-x64.tar.gz" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasyad-linux-v${{ steps.app_version.outputs.name }}-${{ github.sha }}
          path: nasyad-v${{ steps.app_version.outputs.name }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_windows:
    name: Build Windows
    needs: [changes, verify]
    if: >
      always() &&
      needs.changes.outputs.client == 'true' &&
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'push' &&
         (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')))
    # windows-latest currently has VS 2026; Flutter 3.35.x maps unknown VS to
    # "Visual Studio 16 2019" and fails. Pin 2022 until we bump Flutter past 3.38.2.
    runs-on: windows-2022
    outputs:
      app_version_name: ${{ steps.app_version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          FULL="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?)/\1/p' pubspec.yaml | head -n1)"
          NAME="${FULL%%+*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows release
        shell: cmd
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        working-directory: client/build/windows/x64/runner/Release
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "nasyad-v${{ steps.app_version.outputs.name }}-windows-x64.zip"
          if (Test-Path $dest) { Remove-Item -Force $dest }
          # Use -Path with a string so the shell does not expand * into multiple args.
          Compress-Archive -Path "*" -DestinationPath $dest -Force
          Get-Item $dest | Format-List FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasyad-windows-v${{ steps.app_version.outputs.name }}-${{ github.sha }}
          path: nasyad-v${{ steps.app_version.outputs.name }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [build_apk, build_linux, build_windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Override monorepo client default — release packaging is at repo root.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nasyad-apk-v${{ needs.build_apk.outputs.app_version_name }}-${{ github.sha }}
          path: dist/apk

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: nasyad-linux-v${{ needs.build_linux.outputs.app_version_name }}-${{ github.sha }}
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nasyad-windows-v${{ needs.build_windows.outputs.app_version_name }}-${{ github.sha }}
          path: dist/windows

      - name: Rename APKs for release
        run: |
          VERSION="${{ needs.build_apk.outputs.app_version_name }}"
          mv dist/apk/app-armeabi-v7a-release.apk "dist/nasyad-v${VERSION}-armeabi-v7a.apk"
          mv dist/apk/app-arm64-v8a-release.apk "dist/nasyad-v${VERSION}-arm64-v8a.apk"
          mv dist/apk/app-x86_64-release.apk "dist/nasyad-v${VERSION}-x86_64.apk"

      - name: Collect release assets
        run: |
          VERSION="${{ needs.build_apk.outputs.app_version_name }}"
          mv dist/linux/nasyad-v${VERSION}-linux-x64.tar.gz dist/
          mv dist/windows/nasyad-v${VERSION}-windows-x64.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nasyad ${{ needs.build_apk.outputs.app_version_name }}
          body_path: docs/domain/releases/v${{ needs.build_apk.outputs.app_version_name }}.md
          files: |
            dist/nasyad-v${{ needs.build_apk.outputs.app_version_name }}-armeabi-v7a.apk
            dist/nasyad-v${{ needs.build_apk.outputs.app_version_name }}-arm64-v8a.apk
            dist/nasyad-v${{ needs.build_apk.outputs.app_version_name }}-x86_64.apk
            dist/nasyad-v${{ needs.build_apk.outputs.app_version_name }}-linux-x64.tar.gz
            dist/nasyad-v${{ needs.build_apk.outputs.app_version_name }}-windows-x64.zip
          generate_release_notes: false
