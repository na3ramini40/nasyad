# Local dev only — server in Docker; Flutter runs on the host via ./tool/dev.sh
services:
  server:
    build:
      context: ./server
    ports:
      - "8000:8000"
    env_file:
      - .env/.compose.env
    volumes:
      - ./server:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
