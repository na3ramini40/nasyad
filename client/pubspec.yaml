name: nasyad
description: "A new Flutter project."
publish_to: 'none'
version: 1.4.0+7
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # network (app updates from GitHub Releases)
  http: ^1.6.0
  crypto: ^3.0.6
  # database
  drift: ^2.23.0
  drift_flutter: ^0.2.8
  sqlite3: ^2.9.4
  # di
#  get_it: ^9.2.0
#  injectable: ^2.7.1
  # state
  flutter_bloc: ^9.1.1
  # navigation
  go_router: ^17.0.1
  app_links: ^6.4.1
  # notifications
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  # date & localization
  intl: any
#  shamsi_date: ^1.1.1
  # places (OpenStreetMap via flutter_map + GPS)
  geolocator: ^13.0.4
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
#  persian_datetime_picker: ^3.2.0
  # models
#  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.8
  # transfer (export / import / share)
  share_plus: ^11.1.0
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  # prefs (last-seen app version)
  shared_preferences: ^2.5.3
  shamsi_date: ^1.1.1
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
#  freezed: ^3.2.4
#  json_serializable: ^6.11.3
#  injectable_generator: ^2.12.0
  go_router_builder: ^4.1.3
#  intl_utils: ^2.8.13
  drift_dev: ^2.23.0
#  mocktail: ^1.0.4
#  drift_db_viewer: ^2.1.0


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - lib/core/data/schedule_templates.json
  fonts:
    - family: Vazir
      fonts:
        - asset: fonts/vazir/Vazir-Regular.ttf
          weight: 400
        - asset: fonts/vazir/Vazir-Medium.ttf
          weight: 500
        - asset: fonts/vazir/Vazir-Medium.ttf
          weight: 600
        - asset: fonts/vazir/Vazir-Bold.ttf
          weight: 700
